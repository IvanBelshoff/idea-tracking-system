# Servidor da SPA em produção. Roda sem privilégios (porta 8080) na imagem nginx-unprivileged.

# A página do link de aprovação (M24, RN-184) não é indexada. Valor vazio = cabeçalho não sai.
# $request_uri, porque o try_files troca o $uri por /index.html antes da resposta.
map $request_uri $its_robots {
  ~^/aprovar(\?|$) "noindex, nofollow";
  default "";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Anexos e fotos passam pela API; limite acima do maior anexo configurável.
  client_max_body_size 12m;

  # Cabeçalhos de segurança (valem para todas as respostas; nenhum "location" usa add_header).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Robots-Tag $its_robots always;
  # A política de conteúdo (CSP) será definida com as telas reais (M0V/M1).

  # API: mesma origem, sem CORS. Resolução tardia do nome "api" (o nginx sobe mesmo sem a API).
  resolver 127.0.0.11 valid=30s ipv6=off;
  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fundo da tela de login (M23, RN-178): o vídeo vai até 20 MB, acima do limite geral. Só este caminho
  # ganha o limite maior; a API confere de novo o tamanho e o tipo de cada arquivo (413 e 415).
  location /api/branding/login/media/ {
    client_max_body_size 24m;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API de integração (M16, RN-106): outros sistemas leem o ITS por aqui, com token no cabeçalho
  # Authorization. Fica fora de /api para o TI poder liberar ou bloquear este caminho sozinho. Leitura só com GET e
  # escrita só nas quatro rotas declaradas (M18, com Idempotency-Key); sem CORS e sem cache: a própria API
  # responde isso (nenhum add_header aqui, ver o topo).
  location /integration/ {
    set $integration_upstream http://api:3000;
    proxy_pass $integration_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Ajuda (serviço "docs"): mesmo endereço do ITS, em /ajuda/. Com ela fora do ar, uma página
  # simples avisa, e o ITS segue funcionando normalmente.
  location /ajuda/ {
    set $docs_upstream http://docs:8080;
    proxy_pass $docs_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 502 503 504 =503 /ajuda-indisponivel.html;
  }
  location = /ajuda {
    return 301 /ajuda/;
  }

  # Arquivos com hash no nome podem ficar em cache por muito tempo.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # App instalável (RN-83): o manifesto vem da API, com a cor e os ícones da organização. Com a API
  # fora do ar, vale a reserva estática (padrão do ITS), para o app continuar instalável.
  location = /manifest.webmanifest {
    set $manifest_upstream http://api:3000/api/branding/manifest.webmanifest;
    proxy_pass $manifest_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 404 500 502 503 504 = /its.webmanifest;
  }

  # O mime.types da imagem não conhece .webmanifest; sem cache, para uma versão nova chegar logo.
  location = /its.webmanifest {
    types { }
    default_type application/manifest+json;
    expires -1;
  }

  # SPA: qualquer outra rota cai no index.html, que nunca fica em cache.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
