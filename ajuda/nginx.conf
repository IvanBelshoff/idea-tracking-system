# Ajuda do ITS: arquivos estáticos em /ajuda/. Fica atrás do "web" do ITS (mesmo endereço), que
# acrescenta os cabeçalhos de segurança; este servidor não é publicado em porta nenhuma.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  # Arquivos com hash no nome podem ficar em cache por muito tempo.
  location /ajuda/_next/static/ {
    expires 1y;
    try_files $uri =404;
  }

  # Páginas: sem cache, para a versão nova da ajuda chegar junto com a do ITS.
  location /ajuda/ {
    expires -1;
    try_files $uri $uri/index.html $uri/ =404;
    error_page 404 /ajuda/nao-encontrada.html;
  }

  location = / {
    return 302 /ajuda/;
  }
}
