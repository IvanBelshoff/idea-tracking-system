<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada · Page not found</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { display: grid; place-items: center; min-height: 100svh; margin: 0; padding: 1rem; }
      main { max-width: 32rem; text-align: center; line-height: 1.6; }
      h1 { font-size: 1.5rem; }
      a { color: #5458c8; font-weight: 600; }
      /* Fundo e texto explícitos no escuro: não dependem do que o navegador pinta por padrão (e o axe confere). */
      @media (prefers-color-scheme: dark) { body { background: #0f0f14; color: #ececf1; } a { color: #9ea6ff; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Esta página da ajuda não existe</h1>
      <p>Talvez o endereço tenha mudado. <a href="/ajuda/pt-BR/">Ir para o início da ajuda</a>.</p>
      <p lang="en">This help page does not exist. <a href="/ajuda/en/">Go to the help home</a>.</p>
    </main>
  </body>
</html>
