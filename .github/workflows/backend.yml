# CI do backend (pasta backend/). Roda só quando algo do backend muda.
name: Backend

on:
  # Também chamado pelo fluxo de publicação (release.yml), que roda as mesmas verificações antes de publicar.
  workflow_call:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: its
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U its"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: backend/package.json # versão lida de "packageManager"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          # Banco de manutenção: a suíte cria e descarta os bancos de teste (prefixo abaixo).
          DATABASE_URL: postgresql://its:ci-only-password@localhost:5432/postgres
          TEST_DATABASE_PREFIX: its_test_
      - run: pnpm build
      - name: Contrato OpenAPI atualizado
        run: |
          pnpm openapi:export
          git diff --exit-code openapi.json || (echo "::error::backend/openapi.json desatualizado: rode 'pnpm openapi:export' no backend e versione o arquivo." && exit 1)
      - name: Auditoria de dependências
        run: pnpm audit --prod --audit-level=high

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build da imagem Docker
        run: docker build -t its-api:ci .
