# Verificações do repositório inteiro: segredos (sempre) e Compose (quando a orquestração muda).
# Backend e frontend têm workflows próprios (backend.yml e frontend.yml), filtrados por pasta.
name: CI

on:
  # Também chamado pelo fluxo de publicação (release.yml), que roda as mesmas verificações antes de publicar.
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Varredura de segredos (gitleaks, histórico completo)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose válido e .env obrigatório
        run: |
          cp .env.example .env
          # Sem preencher, o Compose precisa parar (não existe senha padrão).
          if docker compose config -q 2>/dev/null; then echo "O Compose subiu com o .env vazio"; exit 1; fi
          sed -i -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-teste/' -e 's/^APP_SECRET_KEY=$/APP_SECRET_KEY=ci-teste/' .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.dev.yml config -q
